# 生物升级模块配置（狼、铁傀儡属性升级）
Entity-Upgrades:
  # 各等级升级消耗宝珠数量
  # 例：'1': 100 代表 1级升级需要 100 宝珠
  # 生命值升级价格
  Health-Tiers:
    '1': 100
    '2': 200
    '3': 350
    '4': 500
  # 攻击力升级价格
  Damage-Tiers:
    '1': 150
    '2': 300
    '3': 450
    '4': 600
  # 移动速度升级价格
  Speed-Tiers:
    '1': 50
    '2': 100
    '3': 150
    '4': 250
  # 最终防御等级升级价格
  Final-Defense-Tiers:
    '1': 200
    '2': 350
  # 集群感知等级升级价格
  Swarm-Awareness-Tiers:
    '1': 200
    '2': 350


