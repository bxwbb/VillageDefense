# MySQL 数据库配置
# 除非你开启了 MySQL 支持，否则不需要修改这里
# 开启方法：进入 config.yml，将 Database 设置为 true

# 数据库连接地址
# 将 <databasename> 替换为你的数据库名称
address: jdbc:mysql://localhost:3306/<databasename>?useSSL=false&autoReConnect=true

# MySQL 用户名
user: <user>

# MySQL 密码
password: <password>

# 数据表名称
table: vd_playerstats

# 职业购买记录表；所有互通服务器必须保持一致
kit-purchases-table: vd_playerstats_kit_purchases

# HikariCP 数据库连接最大生命周期
# 文档参考：https://github.com/brettwooldridge/HikariCP#frequently-used
# 默认 1800000 = 30 分钟
maxLifeTime: 1800000

# 请勿修改此处版本校验配置
# 虽然是你的服务器，想改也拦不住你！
# 真心不建议乱改哦 ;p
# 你还是偷偷改了是吧？下次别乱碰这里啦！
Do-Not-Edit:
  File-Version: 1
  Core-Version: 1
