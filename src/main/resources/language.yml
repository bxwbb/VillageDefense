#    你可以在这里翻译 Village Defense 插件的消息。
#             支持颜色代码 (&)。
#
#             使用 \n 来换行。
#             像物品描述这样的消息不支持换行，
#             它们会自动每40个字符换行一次。
#
#     某些消息支持它们自己的占位符，
#            例如 %player%、%kit% 等。

#
# 颜色方案
#
Color:
  Placeholder:
    Value: "&a"
    Number: "&a"
    Player: "&b"
    Other: "&a"
  Chat:
    Issue: "&c"
    Messages: "&7"
    Special-Char:
      Contains: "[,],(,),{,},■,/,|,▸"
      Before: "&8"


