# 建议查看官方维基了解更多详细设置！
# 以下固定键名请勿改名：
# DEFAULT_SPEED、SPEED1~SPEED4、AUTO_TELEPORT、NIGHT_VISION、FIRST_PERSON_MODE、SPECTATORS_VISIBILITY
# 这些都是插件内置绑定好的功能标识

# 旁观者设置菜单
Settings-Menu:
  Inventory-name: "&7旁观者设置"
  Content:
    # 默认移动速度
    'DEFAULT_SPEED':
      material: LEATHER_BOOTS
      # 菜单格子位置，0 为第一格
      slot: 11
      name: "默认速度"
      description:
        - "恢复为原版默认移动速度"
      permission: ""
      execute:
        # 也可以用控制台指令自定义添加药水效果
        - ""

    # 速度 I
    'SPEED1':
      material: CHAINMAIL_BOOTS
      slot: 12
      name: "速度 Ⅰ"
      description:
        - "给予速度 1 药水效果"
      permission: ""
      execute:
        - ""

    # 速度 II
    'SPEED2':
      material: IRON_BOOTS
      slot: 13
      name: "速度 Ⅱ"
      description:
        - "给予速度 2 药水效果"
      permission: ""
      execute:
        - ""

    # 速度 III
    'SPEED3':
      material: GOLDEN_BOOTS
      slot: 14
      name: "速度 Ⅲ"
      description:
        - "给予速度 3 药水效果"
      permission: ""
      execute:
        - ""

    # 速度 IV
    'SPEED4':
      material: DIAMOND_BOOTS
      slot: 15
      name: "速度 Ⅳ"
      description:
        - "给予速度 4 药水效果"
      permission: ""
      execute:
        - ""

    # 自动跟随传送
    'AUTO_TELEPORT':
      material: COMPASS
      slot: 20
      name: "自动跟随传送"
      description:
        - "自动传送到你所跟随的玩家身边"
      permission: ""
      execute:
        - ""

    # 夜视模式
    'NIGHT_VISION':
      material: ENDER_PEARL
      slot: 21
      name: "夜视效果"
      description:
        - "开启夜视，黑暗中也能清晰看见玩家"
      permission: ""
      execute:
        - ""

    # 第一人称旁观
    'FIRST_PERSON_MODE':
      material: CLOCK
      slot: 23
      name: "第一人称模式"
      description:
        - "以第一人称视角旁观玩家游玩"
      permission: ""
      execute:
        - ""

    # 旁观者可见性
    'SPECTATORS_VISIBILITY':
      material: REDSTONE
      slot: 24
      name: "旁观者可见开关"
      description:
        - "可以隐藏/显示其他旁观者，避免视线遮挡"
      permission: ""
      execute:
        - ""


