# 职业技能配置文件。
# 职业文件内使用 skills: [rage] 指向这里的技能 key。
# 第一个非 lightning / looter 技能作为右键主技能；lightning 为攻击被动，looter 为经济被动。
# 技能不会发放物品，而是内嵌在职业内，游戏中通过 BossBar 显示状态。

# 所有技能定义都放在 Skills 节点下。
Skills:
  # 狂暴：右键开启后，血量越低伤害越高。
  rage:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: RAGE
    # BossBar 显示的技能名称。
    Display-Name: "&c&l狂暴"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 技能持续时间，单位：秒。
    Duration: 20
    # 最大伤害倍率，3.0 = 最高 3 倍伤害。
    Max-Damage-Multiplier: 3.0

  # 剑刃：向前释放可穿墙的剑刃。
  blade:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: BLADE
    # BossBar 显示的技能名称。
    Display-Name: "&f&l剑刃"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 剑刃最大飞行距离，单位：格。
    Max-Distance: 20
    # 剑刃移动速度，单位：格/秒。
    Speed-Per-Second: 7
    # 剑刃横向长度，单位：格；3 = 约 3 格宽的弧形剑气。
    Width: 3
    # 命中后造成目标最大生命值百分比伤害，20 = 25%。
    Damage-Percent: 25

  # 爆破：在玩家面前生成 TNT。
  explosion:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: EXPLOSION
    # BossBar 显示的技能名称。
    Display-Name: "&c&l爆破"
    # 技能冷却时间，单位：秒。
    Cooldown: 90
    # 生成 TNT 数量。
    Count: 2
    # TNT 引信时间，单位：秒。
    Fuse-Seconds: 2
    # TNT 生成在玩家前方的距离，单位：格。
    Front-Distance: 2
    # TNT 爆炸威力；技能 TNT 不破坏方块。
    Power: 10.0

  # 石砖墙：在玩家前方生成临时石砖墙。
  stone_wall:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: STONE_WALL
    # BossBar 显示的技能名称。
    Display-Name: "&7&l石砖墙"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 石砖墙持续时间，单位：秒。
    Duration: 20
    # 石砖墙宽度，单位：格。
    Width: 9
    # 石砖墙高度，单位：格。
    Height: 3
    # 石砖墙生成在玩家前方的距离，单位：格。
    Front-Distance: 3

  # 诱饵：生成一个村民诱饵，怪物会优先攻击它。
  decoy:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: DECOY
    # BossBar 显示的技能名称。
    Display-Name: "&e&l诱饵"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 诱饵存在时间，单位：秒。
    Duration: 15
    # 诱饵生命值。
    Health: 200
    # 诱饵实体显示名称。
    Name: "&e&l诱饵"

  # 治疗：全队持续恢复生命值。
  heal:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: HEAL
    # BossBar 显示的技能名称。
    Display-Name: "&a&l治疗"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 治疗持续时间，单位：秒。
    Duration: 20
    # 每秒恢复生命值，3 = 1.5 颗心。
    Heal-Per-Second: 3

  # 抗性提升：给玩家添加抗性效果。
  resistance:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: RESISTANCE
    # BossBar 显示的技能名称。
    Display-Name: "&b&l抗性提升"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 抗性持续时间，单位：秒。
    Duration: 20
    # 药水效果等级，2 = 抗性 II。
    Amplifier: 3

  # 雷电：攻击时概率触发的被动技能。
  lightning:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: LIGHTNING
    # 技能显示名称；被动技能不会显示 BossBar。
    Display-Name: "&e&l雷电"
    # 触发概率，10 = 10%。
    Chance-Percent: 10
    # 触发后额外造成目标最大生命值百分比伤害，10 = 15%。
    Damage-Percent: 15

  # 击退：击退周围怪物并造成百分比伤害。
  knockback:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: KNOCKBACK
    # BossBar 显示的技能名称。
    Display-Name: "&e&l击退"
    # 技能冷却时间，单位：秒。
    Cooldown: 120
    # 技能作用半径，单位：格。
    Radius: 6
    # 水平击退力度。
    Knockback-Strength: 2.5
    # 垂直击退力度。
    Knockback-Y: 0.5
    # 造成目标最大生命值百分比伤害，10 = 20%。
    Damage-Percent: 20

  # 黑洞：召唤黑洞吸引怪物，并持续造成伤害。
  black_hole:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: BLACK_HOLE
    # BossBar 显示的技能名称。
    Display-Name: "&5&l黑洞"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 黑洞持续时间，单位：秒。
    Duration: 7
    # 黑洞吸引半径，单位：格。
    Radius: 5
    # 黑洞生成在玩家前方的距离，单位：格。
    Front-Distance: 4
    # 黑洞释放后会沿玩家朝向缓慢前进，固定速度：每秒 2 格。
    # 黑洞吸引力度。
    Pull-Strength: 0.65
    # 每秒造成目标最大生命值百分比伤害，8 = 8%。
    Damage-Percent: 8
    # 黑洞刷新间隔，单位：tick；20 tick = 1 秒。
    Interval-Ticks: 5
    # 黑洞显示粒子名称。
    Particle: PORTAL

  # 斩杀：攻击时，如果目标低于血量阈值则直接击杀；这是被动技能，不需要右键触发。
  execute:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: EXECUTE
    # 技能显示名称；被动技能不会显示 BossBar。
    Display-Name: "&c&l斩杀"
    # 可被斩杀的生命值阈值，20 = 当前生命值低于最大生命值 20%。
    Health-Threshold-Percent: 20

  # 掠夺：经济收益提升的被动技能。
  looter:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: LOOTER
    # 技能显示名称；被动技能不会显示 BossBar。
    Display-Name: "&6&l掠夺"
    # 经济收益倍率，1.3 = 获得 1.3 倍宝珠。
    Multiplier: 1.3

  # 铁傀儡：在玩家当前位置召唤友方铁傀儡。
  golem:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: GOLEM
    # BossBar 显示的技能名称。
    Display-Name: "&f&l铁傀儡"
    # 技能冷却时间，单位：秒。
    Cooldown: 100

  # 粒子箭：向前连续释放蓝色粒子箭。
  particle_arrow:
    # 是否启用该技能。
    Enabled: true
    # 技能类型，必须和插件内置类型一致。
    Type: PARTICLE_ARROW
    # BossBar 显示的技能名称。
    Display-Name: "&b&l粒子箭"
    # 技能冷却时间，单位：秒。
    Cooldown: 100
    # 连续释放粒子箭数量。
    Count: 50
    # 每支粒子箭之间的间隔，单位：tick；20 tick = 1 秒。
    Interval-Ticks: 4
    # 单支粒子箭最大飞行距离，单位：格。
    Max-Distance: 20
    # 单支粒子箭飞行速度，单位：格/秒。
    Speed-Per-Second: 10
    # 命中后造成目标最大生命值百分比伤害， 10%。
    Damage-Percent: 10
    # 粒子箭显示粒子名称。
    Particle: FLAME
